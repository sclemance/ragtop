name: Bug report
description: Something works wrongly on a machine where Ragtop otherwise runs
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to bring it about
      description: The shortest sequence you know of that shows it.
  - type: input
    id: device
    attributes:
      label: Machine and versions
      placeholder: Surface Book 2 — detachable · Ragtop 0.35.6 · Omarchy 4.0.0
    validations:
      required: true
  - type: textarea
    id: state
    attributes:
      label: What Ragtop thinks is going on
      description: |
        Open the Omarchy menu and tap Setup › Tablet › Diagnostics. That puts
        the machine, the versions and every setting on your clipboard, so
        paste it here. From a terminal it is `ragtop diagnostics`.

        It carries no paths under your home directory, no host name and no
        user name. Nothing in it is sensitive.
      render: shell
